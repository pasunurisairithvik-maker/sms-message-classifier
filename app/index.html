<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMS Classifier</title><style>body{font:17px system-ui;background:#f2f5fa;color:#172338;max-width:760px;margin:60px auto;padding:24px}main{background:white;padding:32px;border-radius:16px}textarea{width:100%;box-sizing:border-box;font:inherit;padding:12px}button{background:#2359c4;color:white;border:0;border-radius:8px;padding:12px 20px;margin-top:20px;cursor:pointer}pre{white-space:pre-wrap;background:#eef2f8;padding:20px}small{color:#566}</style><main><h1>SMS Message Classifier</h1><p>A small experiment comparing text-classification baselines.</p><form id="form"><label for="message">Enter an example message</label><textarea id="message" rows="4" maxlength="5000" required>Can we meet tomorrow afternoon?</textarea><button>Classify message</button></form><pre id="result" aria-live="polite">Train the model before using this demo.</pre><small>English SMS benchmark prototype. Do not paste private messages or rely on it for scam detection.</small></main><script>document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const output=document.getElementById('result');output.textContent='Classifying…';try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('message').value})});output.textContent=JSON.stringify(await response.json(),null,2)}catch(error){output.textContent='Cannot reach the local server.'}};</script></html>
